<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FireCase · Offline field kit</title><link rel="stylesheet" href="/offline.css"><script src="/offline.js" defer></script></head><body><main><header><b>🔥 FireCase</b><span>Offline field kit</span></header><p class="notice">Saved snapshot · demo schematic map · no live updates</p><h1 id="title">Loading downloaded case…</h1><p id="location"></p><p id="saved"></p><section id="map" aria-label="Downloaded schematic map"></section><p class="notice">Illustrative tiles only. Not for navigation or emergency decisions.</p><section><h2>Access notes</h2><ul id="resources"></ul></section><form id="report"><h2>Save a field report</h2><label>Incident status<select id="status"><option value="confirmed">Confirmed</option><option value="contained">Contained</option><option value="out">Out</option></select></label><label>Photo (JPG/PNG, max 5 MB)<input id="photo" type="file" accept="image/jpeg,image/png" capture="environment"></label><label>Field remarks<textarea id="remarks" maxlength="5000" rows="3"></textarea></label><button id="save">Save report on this device</button></form><p id="message" role="status"></p><a href="/">Return to online workspace to review and submit saved reports</a></main></body></html>
